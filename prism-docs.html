<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prism Documents</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
:root{
  --ah:142;--as:72%;--al:42%;
  --accent:hsl(var(--ah),var(--as),var(--al));
  --accent-bg:hsl(var(--ah),60%,97%);
  --accent-border:hsl(var(--ah),50%,88%);
  --bg:#f2f2f7;--surface:rgba(255,255,255,0.78);--surface-solid:#fff;
  --border:rgba(0,0,0,0.08);--border2:rgba(255,255,255,0.85);
  --text1:#1c1c1e;--text2:#3a3a3c;--text3:#8e8e93;--text4:#aeaeb2;
  --radius:18px;--radius-xs:8px;
  --shadow:0 2px 16px rgba(0,0,0,0.07),0 1px 3px rgba(0,0,0,0.04);
  --shadow-md:0 4px 30px rgba(0,0,0,0.1),0 1px 6px rgba(0,0,0,0.05);
  --header-bg:rgba(242,242,247,0.88);
}
[data-theme="dark"]{
  --bg:#0a0a0c;--surface:rgba(28,28,30,0.88);--surface-solid:#1c1c1e;
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.07);
  --text1:#f2f2f7;--text2:#d1d1d6;--text3:#8e8e93;--text4:#48484a;
  --header-bg:rgba(10,10,12,0.88);color-scheme:dark;
}
[data-theme="dark"] .tab-btn.active{background:#2c2c2e;color:var(--text1)}
[data-theme="dark"] .form-select,[data-theme="dark"] .form-input,[data-theme="dark"] textarea{background:rgba(44,44,46,0.8);border-color:rgba(255,255,255,0.1);color:var(--text1)}
[data-theme="dark"] .doc-preview{background:#0f1117;border-color:rgba(255,255,255,0.08)}
[data-theme="dark"] .csv-table th{background:rgba(255,255,255,0.06)}
[data-theme="dark"] .csv-table tr:nth-child(even) td{background:rgba(255,255,255,0.025)}

/* BOOT */
#boot{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;transition:opacity 0.55s ease}
.boot-brand{display:flex;align-items:center;gap:16px;animation:boot-fadein 0.7s 0.2s ease both}
.boot-wordmark{font-size:2.6rem;font-weight:700;letter-spacing:-0.03em;color:#fff;line-height:1}
.boot-bar-wrap{width:200px;animation:boot-fadein 0.7s 0.6s ease both}
.boot-bar-track{height:2px;background:rgba(255,255,255,0.12);border-radius:1px;overflow:hidden}
.boot-bar-fill{height:100%;background:rgba(255,255,255,0.75);border-radius:1px;width:0%;animation:boot-progress 2s 0.7s cubic-bezier(0.4,0,0.55,1) forwards}
@keyframes boot-fadein{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
@keyframes boot-progress{0%{width:0%}20%{width:28%}55%{width:62%}85%{width:88%}100%{width:100%}}
.boot-prism-ray{animation:ray-pulse 2s ease-in-out infinite}
.boot-prism-ray:nth-child(1){animation-delay:0s}.boot-prism-ray:nth-child(2){animation-delay:.15s}
.boot-prism-ray:nth-child(3){animation-delay:.3s}.boot-prism-ray:nth-child(4){animation-delay:.45s}
.boot-prism-ray:nth-child(5){animation-delay:.6s}
@keyframes ray-pulse{0%,100%{opacity:.3}50%{opacity:.8}}
#app{opacity:1}

.header{position:sticky;top:0;z-index:100;height:52px;padding:0 max(20px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--header-bg);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border);transition:background .3s}
.header-left{display:flex;align-items:center;gap:10px}
.header-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px hsl(var(--ah),50%,88%);flex-shrink:0;transition:all .4s}
.header-name{font-weight:600;font-size:1rem;letter-spacing:-.015em;color:var(--text1)}
.header-status{font-size:.75rem;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.header-right{display:flex;align-items:center;gap:6px}
.header-icon-btn{width:32px;height:32px;border-radius:10px;border:none;background:rgba(0,0,0,0.05);color:var(--text2);display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0}
.header-icon-btn:hover{background:rgba(0,0,0,0.1);color:var(--text1)}
[data-theme="dark"] .header-icon-btn{background:rgba(255,255,255,0.07);color:var(--text3)}
[data-theme="dark"] .header-icon-btn:hover{background:rgba(255,255,255,0.12);color:var(--text1)}
.app-nav{display:flex;gap:4px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-left));background:var(--header-bg);border-bottom:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);scrollbar-width:none;-ms-overflow-style:none;position:sticky;top:52px;z-index:99;transition:background .3s}
.app-nav::-webkit-scrollbar{display:none}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:100px;font-size:.78rem;font-weight:500;color:var(--text3);text-decoration:none;white-space:nowrap;transition:background .2s,color .2s;flex-shrink:0;border:1px solid transparent}
.nav-item:hover{background:rgba(0,0,0,0.06);color:var(--text1)}
.nav-item.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px hsl(var(--ah),60%,72%)}
.nav-item svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[data-theme="dark"] .nav-item:hover{background:rgba(255,255,255,0.08)}
.main{max-width:820px;margin:0 auto;padding:28px 16px 100px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .25s,background .3s}

#drop-zone{position:relative;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 24px;text-align:center;cursor:pointer;transition:background .25s}
#drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:5}
#drop-zone.dragover{background:var(--accent-bg);box-shadow:inset 0 0 0 2px var(--accent)}
.drop-icon-wrap{width:64px;height:64px;border-radius:18px;background:hsl(var(--ah),40%,92%);display:flex;align-items:center;justify-content:center;transition:transform .25s}
[data-theme="dark"] .drop-icon-wrap{background:hsl(var(--ah),25%,18%)}
#drop-zone:hover .drop-icon-wrap{transform:scale(1.06)}
.drop-icon{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop-title{font-size:1.05rem;font-weight:600;color:var(--text1)}
.drop-sub{font-size:.82rem;color:var(--text3);line-height:1.55;max-width:300px}
.drop-pills{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:2px}
.pill{font-size:.63rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:100px;background:hsl(var(--ah),40%,92%);color:var(--accent)}
[data-theme="dark"] .pill{background:hsl(var(--ah),25%,18%)}

.file-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border)}
.file-icon-box{width:40px;height:40px;border-radius:9px;background:hsl(var(--ah),40%,92%);display:flex;align-items:center;justify-content:center;flex-shrink:0}
[data-theme="dark"] .file-icon-box{background:hsl(var(--ah),25%,18%)}
.file-icon-box svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.file-info{flex:1;min-width:0}
.file-name{font-size:.88rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text1)}
.file-meta{font-size:.72rem;color:var(--text3);margin-top:2px}
.file-clear{width:28px;height:28px;border-radius:8px;border:none;background:none;color:var(--text4);font-size:.85rem;cursor:pointer;transition:background .15s,color .15s;display:flex;align-items:center;justify-content:center}
.file-clear:hover{background:rgba(255,59,48,.12);color:#ff3b30}

/* TABS */
.tabs-wrap{padding:12px 16px;border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,0.05);border-radius:11px;padding:3px}
[data-theme="dark"] .tabs{background:rgba(255,255,255,0.06)}
.tab-btn{flex:1;font-size:.8rem;font-weight:500;border:none;background:none;padding:7px 4px;border-radius:8px;color:var(--text3);transition:background .2s,color .2s,box-shadow .2s;white-space:nowrap}
.tab-btn.active{background:#fff;color:var(--text1);box-shadow:0 1px 6px rgba(0,0,0,0.1)}
.tab-panel{display:none;padding:16px}
.tab-panel.active{display:block}

/* PREVIEW / OUTPUT */
.doc-preview{font-size:.82rem;line-height:1.7;color:var(--text1);background:#fafafa;border:1px solid rgba(0,0,0,0.07);border-radius:var(--radius-xs);padding:16px;max-height:420px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;font-family:'SF Mono',ui-monospace,monospace;tab-size:2}
.doc-preview-html{font-size:.88rem;line-height:1.75;color:var(--text1);background:var(--surface-solid);border:1px solid var(--border);border-radius:var(--radius-xs);padding:20px;max-height:480px;overflow-y:auto}
.doc-preview-html h1,.doc-preview-html h2,.doc-preview-html h3{font-weight:700;margin:0.8em 0 0.4em;color:var(--text1)}
.doc-preview-html h1{font-size:1.4rem}.doc-preview-html h2{font-size:1.15rem}.doc-preview-html h3{font-size:1rem}
.doc-preview-html p{margin-bottom:.75em}
.doc-preview-html code{background:rgba(0,0,0,0.07);padding:1px 5px;border-radius:4px;font-size:.85em;font-family:'SF Mono',monospace}
.doc-preview-html pre{background:rgba(0,0,0,0.06);padding:12px;border-radius:8px;overflow-x:auto;margin-bottom:.75em}
.doc-preview-html pre code{background:none;padding:0}
.doc-preview-html blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text3);margin:0.6em 0}
.doc-preview-html a{color:var(--accent)}
.doc-preview-html ul,.doc-preview-html ol{padding-left:20px;margin-bottom:.75em}
.doc-preview-html table{border-collapse:collapse;width:100%;font-size:.82rem;margin-bottom:.75em}
.doc-preview-html th,.doc-preview-html td{border:1px solid var(--border);padding:6px 10px}
.doc-preview-html th{background:var(--accent-bg);font-weight:600}
.doc-preview-html hr{border:none;border-top:1px solid var(--border);margin:1em 0}
[data-theme="dark"] .doc-preview-html code{background:rgba(255,255,255,0.1)}
[data-theme="dark"] .doc-preview-html pre{background:rgba(255,255,255,0.06)}

/* CSV TABLE */
.csv-wrap{max-height:420px;overflow:auto;border-radius:var(--radius-xs);border:1px solid var(--border)}
.csv-table{width:100%;border-collapse:collapse;font-size:.78rem;min-width:400px}
.csv-table th{background:hsl(var(--ah),40%,95%);color:var(--text2);font-weight:600;padding:8px 12px;text-align:left;position:sticky;top:0;white-space:nowrap}
.csv-table td{padding:7px 12px;color:var(--text1);border-top:1px solid rgba(0,0,0,0.05);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.csv-table tr:nth-child(even) td{background:rgba(0,0,0,0.02)}
.csv-table tr:hover td{background:rgba(0,0,0,0.04)}

/* FORM */
.form-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
.form-group{display:flex;flex-direction:column;gap:5px;flex:1;min-width:110px}
.form-label{font-size:.72rem;font-weight:500;color:var(--text2)}
.form-select,.form-input{width:100%;padding:9px 12px;border-radius:var(--radius-xs);border:1px solid rgba(0,0,0,0.12);background:rgba(255,255,255,0.8);font-size:.88rem;color:var(--text1);outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.form-select:focus,.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px hsl(var(--ah),60%,90%)}
.form-select-wrap{position:relative}
.form-select-wrap::after{content:'⌄';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}

/* ACTION BAR */
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.action-btn{padding:8px 16px;border-radius:100px;border:none;background:var(--accent);color:#fff;font-size:.78rem;font-weight:600;cursor:pointer;transition:filter .2s;white-space:nowrap}
.action-btn:hover{filter:brightness(1.08)}
.action-btn.secondary{background:rgba(0,0,0,0.07);color:var(--text1)}
[data-theme="dark"] .action-btn.secondary{background:rgba(255,255,255,0.1);color:var(--text2)}
.action-btn.secondary:hover{background:rgba(0,0,0,0.12)}

.stats-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.stat{font-size:.75rem;color:var(--text3)}
.stat strong{color:var(--text1);font-weight:600}

.output-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:44px 20px;color:var(--text4);font-size:.82rem;text-align:center}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(28,28,30,0.92);backdrop-filter:blur(12px);color:#fff;font-size:.82rem;padding:10px 20px;border-radius:100px;pointer-events:none;transition:transform .3s cubic-bezier(0.34,1.56,0.64,1),opacity .3s;opacity:0;white-space:nowrap;z-index:999}
[data-theme="dark"] #toast{background:rgba(200,200,210,0.92);color:#1c1c1e}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.18);border-radius:3px}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15)}
@media(max-width:480px){html{font-size:15px}.main{padding:12px 8px 80px}.header-status{display:none}}
@media(max-width:600px){.main{padding:16px 10px 80px}.header-status{display:none}}
@media(min-width:900px){.main{padding:32px 24px 100px}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-brand">
    <div class="boot-logo">
      <svg width="52" height="52" viewBox="0 0 58 58" fill="none">
        <polygon points="29,3 55,53 3,53" stroke="rgba(255,255,255,0.85)" stroke-width="1.4" fill="rgba(255,255,255,0.04)"/>
        <line x1="29" y1="3" x2="9" y2="53" stroke="#ff6b6b" stroke-width="1" class="boot-prism-ray"/>
        <line x1="29" y1="3" x2="17" y2="53" stroke="#ffd93d" stroke-width="1" class="boot-prism-ray"/>
        <line x1="29" y1="3" x2="26" y2="53" stroke="#6bcb77" stroke-width="1" class="boot-prism-ray"/>
        <line x1="29" y1="3" x2="36" y2="53" stroke="#4d96ff" stroke-width="1" class="boot-prism-ray"/>
        <line x1="29" y1="3" x2="47" y2="53" stroke="#c77dff" stroke-width="1" class="boot-prism-ray"/>
        <circle cx="29" cy="29" r="2.5" fill="rgba(255,255,255,0.6)"/>
      </svg>
    </div>
    <div class="boot-wordmark">Prism</div>
  </div>
  <div class="boot-bar-wrap"><div class="boot-bar-track"><div class="boot-bar-fill"></div></div></div>
</div>

<div id="app">
  <header class="header">
    <div class="header-left">
      <div class="header-dot"></div>
      <span class="header-name">Prism</span>
    </div>
    <div class="header-status">Documents</div>
    <div class="header-right">
      <button class="header-icon-btn" id="dark-mode-btn" aria-label="Toggle dark mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="theme-icon-moon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="theme-icon-sun" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </header>

  <nav class="app-nav">
    <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Images</a>
    <a href="prism-audio.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Audio</a>
    <a href="prism-video.html" class="nav-item"><svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>Video</a>
    <a href="prism-pdf.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>PDF</a>
    <a href="prism-docs.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>Documents</a>
    <a href="prism-archive.html" class="nav-item"><svg viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>Archive</a>
  </nav>

  <main class="main">

    <div class="card">
      <div id="drop-zone">
        <input type="file" id="file-input" accept=".txt,.md,.markdown,.csv,.tsv,.json,.xml,.html,.htm,.log,.rtf">
        <div class="drop-icon-wrap">
          <svg class="drop-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        </div>
        <div class="drop-title">Drop a document here</div>
        <div class="drop-sub">View, convert, and export text-based files</div>
        <div class="drop-pills">
          <span class="pill">TXT</span><span class="pill">Markdown</span><span class="pill">CSV</span>
          <span class="pill">JSON</span><span class="pill">XML</span><span class="pill">HTML</span><span class="pill">LOG</span>
        </div>
      </div>
      <div id="file-bar" style="display:none"></div>
    </div>

    <div class="card" id="controls-card" style="display:none">
      <div class="tabs-wrap">
        <div class="tabs" role="tablist">
          <button class="tab-btn active" data-tab="view">View</button>
          <button class="tab-btn" data-tab="convert">Convert</button>
          <button class="tab-btn" data-tab="stats">Stats</button>
        </div>
      </div>

      <!-- VIEW TAB -->
      <div class="tab-panel active" id="tab-view">
        <div id="view-area"></div>
        <div class="action-bar" id="view-actions"></div>
      </div>

      <!-- CONVERT TAB -->
      <div class="tab-panel" id="tab-convert">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Convert to</label>
            <div class="form-select-wrap">
              <select class="form-select" id="conv-fmt">
                <option value="txt">Plain Text (.txt)</option>
                <option value="md">Markdown (.md)</option>
                <option value="html">HTML (.html)</option>
                <option value="json">JSON (.json)</option>
                <option value="csv">CSV (.csv)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Encoding</label>
            <div class="form-select-wrap">
              <select class="form-select" id="conv-enc">
                <option value="utf-8">UTF-8</option>
                <option value="utf-16">UTF-16</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Line endings</label>
            <div class="form-select-wrap">
              <select class="form-select" id="conv-le">
                <option value="lf">LF (Unix/Mac)</option>
                <option value="crlf">CRLF (Windows)</option>
                <option value="cr">CR (Classic Mac)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">CSV delimiter <span>(for CSV output)</span></label>
            <div class="form-select-wrap">
              <select class="form-select" id="conv-delim">
                <option value=",">Comma (,)</option>
                <option value=";">Semicolon (;)</option>
                <option value="	">Tab (\t)</option>
                <option value="|">Pipe (|)</option>
              </select>
            </div>
          </div>
        </div>
        <button class="action-btn" id="conv-btn" style="margin-top:4px">Convert &amp; Download</button>
      </div>

      <!-- STATS TAB -->
      <div class="tab-panel" id="tab-stats">
        <div id="stats-area" class="stats-row"></div>
      </div>
    </div>

    <div class="card" id="output-wrap">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border)">
        <div style="font-size:.95rem;font-weight:600;color:var(--text1)">Output</div>
        <div style="font-size:.75rem;color:var(--text3);margin-top:2px" id="output-stats"></div>
      </div>
      <div style="padding:16px" id="output-area">
        <div class="output-empty">
          <svg width="34" height="34" viewBox="0 0 58 58" fill="none" style="opacity:.22">
            <polygon points="29,3 55,53 3,53" stroke="currentColor" stroke-width="2" fill="none"/>
            <line x1="29" y1="3" x2="9" y2="53" stroke="#6bcb77" stroke-width="1.2"/>
            <line x1="29" y1="3" x2="26" y2="53" stroke="#4d96ff" stroke-width="1.2"/>
            <line x1="29" y1="3" x2="47" y2="53" stroke="#c77dff" stroke-width="1.2"/>
          </svg>
          <span>Converted files will appear here</span>
        </div>
      </div>
    </div>

  </main>
</div>
<div id="toast"></div>

<script>
var _pageStart=Date.now();
'use strict';
(function(){
  function go(){var b=document.getElementById('boot');if(!b)return;b.style.transition='opacity 0.5s';b.style.opacity='0';setTimeout(function(){b.style.display='none';b.style.visibility='hidden';},520);}
  var delay=Math.max(0,2600-(Date.now()-_pageStart));
  setTimeout(go,delay);
  setTimeout(go,4000);
}());

let isDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyDark(d){isDark=d;document.documentElement.setAttribute('data-theme',d?'dark':'light');document.getElementById('theme-icon-moon').style.display=d?'none':'';document.getElementById('theme-icon-sun').style.display=d?'':'none';}
applyDark(isDark);
document.getElementById('dark-mode-btn').addEventListener('click',()=>applyDark(!isDark));

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtB=b=>b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(2)+'MB';

let currentFile=null, rawText='', fileType='';

// TABS
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const tab=btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===`tab-${tab}`));
  });
});

// DROP
const dropZone=document.getElementById('drop-zone');
const fileInput=document.getElementById('file-input');
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover')});
dropZone.addEventListener('dragleave',e=>{if(!dropZone.contains(e.relatedTarget))dropZone.classList.remove('dragover')});
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])handleFile(fileInput.files[0]);fileInput.value='';});

function getType(name){
  const ext=name.split('.').pop().toLowerCase();
  if(['md','markdown'].includes(ext))return'md';
  if(['csv','tsv'].includes(ext))return ext;
  if(ext==='json')return'json';
  if(ext==='xml')return'xml';
  if(['html','htm'].includes(ext))return'html';
  if(['txt','log','rtf'].includes(ext))return'txt';
  return'txt';
}

async function handleFile(file){
  currentFile=file;
  fileType=getType(file.name);
  rawText=await file.text();
  renderFileBar(file);
  renderView();
  renderStats();
  document.getElementById('controls-card').style.display='block';
}

function renderFileBar(file){
  const bar=document.getElementById('file-bar');
  bar.style.display='flex';
  const icons={md:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',csv:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',json:'<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>'};
  const icon=icons[fileType]||icons.md;
  bar.innerHTML=`<div class="file-icon-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icon}</svg></div><div class="file-info"><div class="file-name">${esc(file.name)}</div><div class="file-meta">${fmtB(file.size)} · ${fileType.toUpperCase()}</div></div><button class="file-clear" onclick="clearFile()">✕</button>`;
}

window.clearFile=function(){
  currentFile=null;rawText='';fileType='';
  document.getElementById('file-bar').style.display='none';
  document.getElementById('controls-card').style.display='none';
};

function renderView(){
  const area=document.getElementById('view-area');
  const actions=document.getElementById('view-actions');

  if(fileType==='csv'||fileType==='tsv'){
    const delim=fileType==='tsv'?'\t':',';
    const rows=rawText.trim().split('\n').map(r=>r.split(delim).map(c=>c.replace(/^"|"$/g,'')));
    const headers=rows[0]||[];
    const body=rows.slice(1);
    area.innerHTML=`<div class="csv-wrap"><table class="csv-table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td title="${esc(c)}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    actions.innerHTML=`<button class="action-btn" onclick="copyRaw()">Copy Raw</button><button class="action-btn secondary" onclick="copyAsJson()">Copy as JSON</button>`;
  }else if(fileType==='json'){
    let formatted=rawText;
    try{formatted=JSON.stringify(JSON.parse(rawText),null,2);}catch(e){}
    area.innerHTML=`<pre class="doc-preview">${esc(formatted)}</pre>`;
    actions.innerHTML=`<button class="action-btn" onclick="copyRaw()">Copy</button><button class="action-btn secondary" onclick="copyMinified()">Copy Minified</button>`;
  }else if(fileType==='md'||fileType==='markdown'){
    const html=mdToHtml(rawText);
    area.innerHTML=`<div class="doc-preview-html">${html}</div>`;
    actions.innerHTML=`<button class="action-btn" onclick="copyRaw()">Copy Markdown</button><button class="action-btn secondary" onclick="copyHtml()">Copy as HTML</button>`;
  }else if(fileType==='html'){
    area.innerHTML=`<div class="doc-preview-html">${rawText}</div>`;
    actions.innerHTML=`<button class="action-btn" onclick="copyRaw()">Copy Source</button>`;
  }else if(fileType==='xml'){
    let formatted=rawText;
    try{
      const parser=new DOMParser();
      const xmlDoc=parser.parseFromString(rawText,'text/xml');
      const xs=new XMLSerializer();
      formatted=formatXml(xs.serializeToString(xmlDoc));
    }catch(e){}
    area.innerHTML=`<pre class="doc-preview">${esc(formatted)}</pre>`;
    actions.innerHTML=`<button class="action-btn" onclick="copyRaw()">Copy</button>`;
  }else{
    area.innerHTML=`<pre class="doc-preview">${esc(rawText)}</pre>`;
    actions.innerHTML=`<button class="action-btn" onclick="copyRaw()">Copy</button>`;
  }
}

function renderStats(){
  const lines=rawText.split('\n').length;
  const words=rawText.trim().split(/\s+/).filter(Boolean).length;
  const chars=rawText.length;
  const charsNoSpace=rawText.replace(/\s/g,'').length;
  const sentences=(rawText.match(/[.!?]+/g)||[]).length;
  const avgWord=words>0?(chars/words).toFixed(1):0;
  document.getElementById('stats-area').innerHTML=[
    `<div class="stat">Lines: <strong>${lines.toLocaleString()}</strong></div>`,
    `<div class="stat">Words: <strong>${words.toLocaleString()}</strong></div>`,
    `<div class="stat">Characters: <strong>${chars.toLocaleString()}</strong></div>`,
    `<div class="stat">Non-space chars: <strong>${charsNoSpace.toLocaleString()}</strong></div>`,
    `<div class="stat">Sentences: <strong>${sentences.toLocaleString()}</strong></div>`,
    `<div class="stat">Avg word length: <strong>${avgWord} chars</strong></div>`,
    `<div class="stat">File size: <strong>${fmtB(currentFile.size)}</strong></div>`,
    `<div class="stat">Encoding: <strong>UTF-8</strong></div>`,
  ].join('');
}

// MARKDOWN → HTML (lightweight parser)
function mdToHtml(md){
  let h=md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^#{6}\s(.+)$/gm,'<h6>$1</h6>')
    .replace(/^#{5}\s(.+)$/gm,'<h5>$1</h5>')
    .replace(/^#{4}\s(.+)$/gm,'<h4>$1</h4>')
    .replace(/^###\s(.+)$/gm,'<h3>$1</h3>')
    .replace(/^##\s(.+)$/gm,'<h2>$1</h2>')
    .replace(/^#\s(.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/~~(.+?)~~/g,'<del>$1</del>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^---+$/gm,'<hr>')
    .replace(/^>\s?(.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^[\-\*]\s(.+)$/gm,'<li>$1</li>')
    .replace(/^\d+\.\s(.+)$/gm,'<li>$1</li>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%">')
    .replace(/\n\n/g,'</p><p>')
    .replace(/^(?!<[hlbipcdoau])/gm,'');
  return '<p>'+h+'</p>';
}

function formatXml(xml){
  let indent=0;
  return xml.replace(/></g,'>\n<').split('\n').map(line=>{
    if(line.match(/^<\/\w/))indent--;
    const s='  '.repeat(Math.max(0,indent))+line;
    if(line.match(/^<\w[^/]*[^/]>.*$/)&&!line.match(/<\/\w/))indent++;
    return s;
  }).join('\n');
}

// COPY HELPERS
window.copyRaw=function(){navigator.clipboard.writeText(rawText).then(()=>showToast('Copied!'))};
window.copyMinified=function(){try{navigator.clipboard.writeText(JSON.stringify(JSON.parse(rawText))).then(()=>showToast('Copied minified JSON!'));}catch(e){showToast('Invalid JSON')}};
window.copyHtml=function(){navigator.clipboard.writeText(mdToHtml(rawText)).then(()=>showToast('Copied as HTML!'))};
window.copyAsJson=function(){
  const delim=fileType==='tsv'?'\t':',';
  const rows=rawText.trim().split('\n').map(r=>r.split(delim).map(c=>c.replace(/^"|"$/g,'')));
  const headers=rows[0]||[];
  const data=rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||''])));
  navigator.clipboard.writeText(JSON.stringify(data,null,2)).then(()=>showToast('Copied as JSON!'));
};

// CONVERT
document.getElementById('conv-btn').addEventListener('click',()=>{
  const fmt=document.getElementById('conv-fmt').value;
  const le=document.getElementById('conv-le').value;
  const delim=document.getElementById('conv-delim').value;
  let out=rawText;

  if(fmt==='html'&&fileType==='md') out=`<!DOCTYPE html>\n<html><head><meta charset="UTF-8"><title>Document</title></head><body>\n${mdToHtml(rawText)}\n</body></html>`;
  else if(fmt==='md'&&fileType==='txt') out=rawText;
  else if(fmt==='json'&&(fileType==='csv'||fileType==='tsv')){
    const d=fileType==='tsv'?'\t':',';
    const rows=rawText.trim().split('\n').map(r=>r.split(d).map(c=>c.replace(/^"|"$/g,'')));
    const headers=rows[0]||[];
    out=JSON.stringify(rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||'']))),null,2);
  }else if(fmt==='csv'&&fileType==='json'){
    try{
      const data=JSON.parse(rawText);
      const arr=Array.isArray(data)?data:[data];
      const keys=Object.keys(arr[0]||{});
      out=[keys.join(delim),...arr.map(row=>keys.map(k=>JSON.stringify(row[k]??'')).join(delim))].join('\n');
    }catch(e){showToast('Invalid JSON');return;}
  }

  // Apply line endings
  out=out.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  if(le==='crlf')out=out.replace(/\n/g,'\r\n');
  else if(le==='cr')out=out.replace(/\n/g,'\r');

  const blob=new Blob([out],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const baseName=(currentFile.name.split('.')[0])||'document';
  const a=document.createElement('a');a.href=url;a.download=`${baseName}.${fmt}`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  showToast(`Downloaded as .${fmt}`);

  // Show in output area
  document.getElementById('output-stats').textContent=`${baseName}.${fmt} · ${fmtB(blob.size)}`;
  document.getElementById('output-area').innerHTML=`<pre class="doc-preview" style="max-height:260px">${esc(out.slice(0,3000))}${out.length>3000?'\n\n… (truncated)':''}</pre>`;
});

let toastT=null;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800)}
</script>
</body>
</html>
