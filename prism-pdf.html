<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prism PDF — Tools</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
:root{
  --ah:0;--as:85%;--al:50%;
  --accent:hsl(var(--ah),var(--as),var(--al));
  --accent-soft:hsl(var(--ah),70%,65%);
  --accent-bg:hsl(var(--ah),60%,97%);
  --accent-border:hsl(var(--ah),50%,88%);
  --bg:#f2f2f7;--surface:rgba(255,255,255,0.78);--surface-solid:#fff;
  --border:rgba(0,0,0,0.08);--border2:rgba(255,255,255,0.85);
  --text1:#1c1c1e;--text2:#3a3a3c;--text3:#8e8e93;--text4:#aeaeb2;
  --radius:18px;--radius-xs:8px;
  --shadow:0 2px 16px rgba(0,0,0,0.07),0 1px 3px rgba(0,0,0,0.04);
  --shadow-md:0 4px 30px rgba(0,0,0,0.1),0 1px 6px rgba(0,0,0,0.05);
  --header-bg:rgba(242,242,247,0.88);
}
[data-theme="dark"]{
  --bg:#0a0a0c;--surface:rgba(28,28,30,0.88);--surface-solid:#1c1c1e;
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.07);
  --text1:#f2f2f7;--text2:#d1d1d6;--text3:#8e8e93;--text4:#48484a;
  --header-bg:rgba(10,10,12,0.88);color-scheme:dark;
}
[data-theme="dark"] .tabs{background:rgba(255,255,255,0.06)}
[data-theme="dark"] .tab-btn.active{background:#2c2c2e;color:var(--text1)}
[data-theme="dark"] .form-select,[data-theme="dark"] .form-input{background:rgba(44,44,46,0.8);border-color:rgba(255,255,255,0.1);color:var(--text1)}

/* BOOT */
#boot{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;transition:opacity 0.55s ease;visibility:hidden}}
.boot-brand{display:flex;align-items:center;gap:16px;animation:boot-fadein 0.7s 0.2s ease both}
.boot-wordmark{font-size:2.6rem;font-weight:700;letter-spacing:-0.03em;color:#fff;line-height:1}
.boot-bar-wrap{width:200px;animation:boot-fadein 0.7s 0.6s ease both}
.boot-bar-track{height:2px;background:rgba(255,255,255,0.12);border-radius:1px;overflow:hidden}
.boot-bar-fill{height:100%;background:rgba(255,255,255,0.75);border-radius:1px;width:0%;animation:boot-progress 2s 0.7s cubic-bezier(0.4,0,0.55,1) forwards}
@keyframes boot-fadein{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
@keyframes boot-progress{0%{width:0%}20%{width:28%}55%{width:62%}85%{width:88%}100%{width:100%}}
.boot-prism-ray{animation:ray-pulse 2s ease-in-out infinite}
.boot-prism-ray:nth-child(1){animation-delay:0s}.boot-prism-ray:nth-child(2){animation-delay:.15s}
.boot-prism-ray:nth-child(3){animation-delay:.3s}.boot-prism-ray:nth-child(4){animation-delay:.45s}
.boot-prism-ray:nth-child(5){animation-delay:.6s}
@keyframes ray-pulse{0%,100%{opacity:.3}50%{opacity:.8}}
#app{opacity:1}

.header{position:sticky;top:0;z-index:100;height:52px;padding:0 max(20px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--header-bg);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border);transition:background .3s}
.header-left{display:flex;align-items:center;gap:10px}
.header-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px hsl(var(--ah),50%,92%);transition:all .4s;flex-shrink:0}
[data-theme="dark"] .header-dot{box-shadow:0 0 0 3px hsl(0,30%,22%)}
.header-name{font-weight:600;font-size:1rem;letter-spacing:-.015em;color:var(--text1)}
.header-status{font-size:.75rem;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.header-right{display:flex;align-items:center;gap:6px}
.header-icon-btn{width:32px;height:32px;border-radius:10px;border:none;background:rgba(0,0,0,0.05);color:var(--text2);display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s;flex-shrink:0}
.header-icon-btn:hover{background:rgba(0,0,0,0.1);color:var(--text1)}
[data-theme="dark"] .header-icon-btn{background:rgba(255,255,255,0.07);color:var(--text3)}
[data-theme="dark"] .header-icon-btn:hover{background:rgba(255,255,255,0.12);color:var(--text1)}
.app-nav{display:flex;gap:4px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-left));background:var(--header-bg);border-bottom:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);scrollbar-width:none;-ms-overflow-style:none;transition:background .3s;position:sticky;top:52px;z-index:99}
.app-nav::-webkit-scrollbar{display:none}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:100px;font-size:.78rem;font-weight:500;color:var(--text3);text-decoration:none;white-space:nowrap;transition:background .2s,color .2s;flex-shrink:0;border:1px solid transparent}
.nav-item:hover{background:rgba(0,0,0,0.06);color:var(--text1)}
.nav-item.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px hsl(0,70%,72%)}
.nav-item svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[data-theme="dark"] .nav-item:hover{background:rgba(255,255,255,0.08)}
.main{max-width:820px;margin:0 auto;padding:28px 16px 100px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .25s,background .3s}

/* DROP */
#drop-zone{position:relative;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 24px;text-align:center;cursor:pointer;transition:background .25s}
#drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:5}
#drop-zone.dragover{background:var(--accent-bg);box-shadow:inset 0 0 0 2px var(--accent)}
.drop-icon-wrap{width:64px;height:64px;border-radius:18px;background:hsl(0,45%,93%);display:flex;align-items:center;justify-content:center;transition:transform .25s}
[data-theme="dark"] .drop-icon-wrap{background:hsl(0,25%,20%)}
#drop-zone:hover .drop-icon-wrap{transform:scale(1.06)}
.drop-icon{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop-title{font-size:1.05rem;font-weight:600;color:var(--text1)}
.drop-sub{font-size:.82rem;color:var(--text3);line-height:1.55;max-width:300px}
.drop-pills{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:2px}
.pill{font-size:.63rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:100px;background:hsl(0,45%,93%);color:var(--accent)}
[data-theme="dark"] .pill{background:hsl(0,25%,20%)}

/* FILE LIST */
#file-list{display:flex;flex-direction:column}
.file-row{display:flex;align-items:center;gap:12px;padding:11px 16px;transition:background .15s}
.file-row:hover{background:rgba(0,0,0,0.02)}
[data-theme="dark"] .file-row:hover{background:rgba(255,255,255,0.03)}
.file-row+.file-row{border-top:1px solid rgba(0,0,0,0.05)}
[data-theme="dark"] .file-row+.file-row{border-color:rgba(255,255,255,0.05)}
.file-pdf-icon{width:44px;height:44px;border-radius:10px;background:#ff3b30;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;color:#fff;letter-spacing:.04em;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-size:.88rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text1)}
.file-meta{font-size:.72rem;color:var(--text3);margin-top:2px}
.file-badge{font-size:.65rem;font-weight:600;padding:3px 9px;border-radius:100px;background:#e5e5ea;color:#8e8e93;flex-shrink:0}
.badge-ready{background:hsl(0,50%,92%);color:var(--accent)}
[data-theme="dark"] .badge-ready{background:hsl(0,25%,22%)}
.badge-working{background:#fff3cd;color:#856404;animation:bpulse .8s ease-in-out infinite alternate}
@keyframes bpulse{to{opacity:.6}}
.badge-done{background:#d4edda;color:#155724}
.badge-error{background:#f8d7da;color:#721c24}
[data-theme="dark"] .badge-done{background:#1a3a27;color:#6fcf97}
.file-order{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text3);font-size:.8rem;display:flex;align-items:center;justify-content:center;cursor:grab}
[data-theme="dark"] .file-order{border-color:rgba(255,255,255,0.1)}
.file-remove{width:28px;height:28px;border-radius:8px;border:none;background:none;color:var(--text4);display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:background .15s,color .15s;flex-shrink:0}
.file-remove:hover{background:rgba(255,59,48,0.12);color:#ff3b30}

/* TABS */
.tabs-wrap{padding:12px 16px;border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,0.05);border-radius:11px;padding:3px}
.tab-btn{flex:1;font-size:.8rem;font-weight:500;border:none;background:none;padding:7px 4px;border-radius:8px;color:var(--text3);transition:background .2s,color .2s,box-shadow .2s;white-space:nowrap}
.tab-btn.active{background:#fff;color:var(--text1);box-shadow:0 1px 6px rgba(0,0,0,0.1)}
.tab-panel{display:none;padding:16px}
.tab-panel.active{display:block}
.form-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
.form-group{display:flex;flex-direction:column;gap:5px;flex:1;min-width:110px}
.form-label{font-size:.72rem;font-weight:500;color:var(--text2)}
.form-label span{color:var(--text3);font-weight:400}
.form-select,.form-input{width:100%;padding:9px 12px;border-radius:var(--radius-xs);border:1px solid rgba(0,0,0,0.12);background:rgba(255,255,255,0.8);font-size:.88rem;color:var(--text1);outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.form-select:focus,.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px hsl(0,70%,92%)}
.form-select-wrap{position:relative}
.form-select-wrap::after{content:'⌄';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.info-box{padding:10px 12px;border-radius:var(--radius-xs);background:var(--accent-bg);border:1px solid var(--accent-border);font-size:.75rem;color:var(--text2);line-height:1.6;margin-top:8px}
.page-range-help{font-size:.72rem;color:var(--text3);margin-top:4px;line-height:1.5}

/* CONVERT */
.convert-wrap{padding:16px}
#convert-btn{width:100%;padding:14px;border-radius:13px;border:none;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:background .4s,transform .15s,box-shadow .25s,opacity .2s;box-shadow:0 4px 14px hsl(0,70%,75%)}
#convert-btn:hover:not(:disabled){filter:brightness(1.05);box-shadow:0 6px 20px hsl(0,65%,72%)}
#convert-btn:active:not(:disabled){transform:scale(0.98)}
#convert-btn:disabled{opacity:.45;cursor:not-allowed}
#convert-btn .btn-sub{display:block;font-size:.72rem;font-weight:400;opacity:.8;margin-top:2px}
#progress-wrap{display:none;padding:14px 16px}
.prog-bar-track{height:3px;background:rgba(0,0,0,0.06);border-radius:2px;overflow:hidden}
[data-theme="dark"] .prog-bar-track{background:rgba(255,255,255,0.1)}
.prog-bar-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width .3s}
.prog-label{font-size:.75rem;color:var(--text3);margin-top:6px;display:flex;justify-content:space-between}
.prog-stage{font-size:.8rem;font-weight:500;color:var(--accent);margin-bottom:6px}

/* OUTPUT */
.output-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.output-title{font-size:.95rem;font-weight:600;color:var(--text1)}
.output-stats{font-size:.75rem;color:var(--text3)}
.dl-all-btn{padding:7px 16px;border-radius:100px;border:none;background:var(--accent);color:#fff;font-size:.78rem;font-weight:600;cursor:pointer;box-shadow:0 2px 8px hsl(0,70%,75%)}
.dl-all-btn:hover{filter:brightness(1.05)}

/* Output items */
.output-list{padding:8px 0}
.out-row{display:flex;align-items:center;gap:12px;padding:11px 16px;transition:background .15s}
.out-row:hover{background:rgba(0,0,0,0.02)}
[data-theme="dark"] .out-row:hover{background:rgba(255,255,255,0.02)}
.out-row+.out-row{border-top:1px solid rgba(0,0,0,0.05)}
.out-pdf-icon{width:40px;height:40px;border-radius:9px;background:#ff3b30;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff;flex-shrink:0}
.out-name{font-size:.85rem;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text1)}
.out-meta{font-size:.7rem;color:var(--text3)}
.out-dl{padding:7px 14px;border-radius:100px;border:none;background:var(--accent);color:#fff;font-size:.75rem;font-weight:600;cursor:pointer;flex-shrink:0;white-space:nowrap}
.out-dl:hover{filter:brightness(1.08)}

/* Page preview grid */
.pages-grid{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.page-card{border-radius:10px;border:1px solid var(--border);overflow:hidden;background:rgba(255,255,255,0.9)}
[data-theme="dark"] .page-card{background:rgba(28,28,30,0.95)}
.page-card:hover{box-shadow:var(--shadow-md)}
.page-img{width:100%;height:100px;object-fit:cover;display:block;cursor:zoom-in}
.page-label{padding:6px 8px;font-size:.68rem;color:var(--text3);display:flex;align-items:center;justify-content:space-between}
.page-dl{background:none;border:none;color:var(--accent);font-size:.68rem;font-weight:600;cursor:pointer}

.output-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:44px 20px;color:var(--text4);font-size:.82rem;text-align:center}

#lightbox{position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s;background:rgba(0,0,0,0)}
#lightbox.open{pointer-events:auto;opacity:1;background:rgba(0,0,0,0.88);backdrop-filter:blur(10px)}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:10px;box-shadow:0 8px 60px rgba(0,0,0,0.5);transform:scale(0.92);transition:transform .25s cubic-bezier(0.34,1.56,0.64,1)}
#lightbox.open img{transform:scale(1)}
.lb-close{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,0.15);color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lb-close:hover{background:rgba(255,255,255,0.25)}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(28,28,30,0.92);backdrop-filter:blur(12px);color:#fff;font-size:.82rem;padding:10px 20px;border-radius:100px;pointer-events:none;transition:transform .3s cubic-bezier(0.34,1.56,0.64,1),opacity .3s;opacity:0;white-space:nowrap;z-index:999}
[data-theme="dark"] #toast{background:rgba(200,200,210,0.92);color:#1c1c1e}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.18);border-radius:3px}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15)}
@media(max-width:480px){html{font-size:15px}.main{padding:12px 8px 80px}.header-status{display:none}.pages-grid{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:600px){.main{padding:16px 10px 80px}.header-status{display:none}.pages-grid{grid-template-columns:1fr 1fr 1fr}}
@media(min-width:900px){.main{padding:32px 24px 100px}}
</style>
</head>

<div id="boot">

      <svg width="52" height="52" viewBox="0 0 58 58" fill="none">
        <polygon points="29,3 55,53 3,53" stroke="rgba(255,255,255,0.85)" stroke-width="1.4" fill="rgba(255,255,255,0.04)"/>

  <nav class="app-nav">
